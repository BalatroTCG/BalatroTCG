[manifest]
version = "1.0.0"
dump_lua = true
priority = 10000

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = "G.GAME.dollars = G.GAME.dollars + mod"
position = "after"
payload = '''
if BalatroTCG.GameActive then
    BalatroTCG.Player.status.dollars = G.GAME.dollars
    if G.GAME.dollars <= G.GAME.bankrupt_at then
        end_tcg_game(false)
    end
end
'''
match_indent = true
overwrite = true

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = "-- TARGET: evaluate your own general effects"
position = "after"
payload = '''
if BalatroTCG.GameActive then
    if card.ability.set == 'Joker' and context.joker_main and not context.blueprint then
        ret.playing_card = ret.playing_card or {}
        --[[
        for k, voucher in ipairs(BalatroTCG.Status_Current.vouchers.cards) do
            
            if voucher.ability.name == 'Hone' then
                ret.playing_card.h_chips = voucher.ability.extra
            elseif voucher.ability.name == 'Glow Up' then
                ret.playing_card.x_mult = voucher.ability.extra
            end
        end
        ]]
    elseif context.destroy_card and context.cardarea == G.play and context.destroy_card == card then
        if card.lucky_trigger then
            ret.playing_card = ret.playing_card or {}
            ret.playing_card.remove = true
        end
    end
end
'''
match_indent = true
overwrite = true

[[patches]]
[patches.pattern]
target = 'functions/common_events.lua'
pattern = "-- TARGET: main scoring on played cards"
position = "after"
payload = '''
if BalatroTCG.GameActive then
    for k, voucher in ipairs(BalatroTCG.Status_Current.vouchers.cards) do
        
        if card:is_playing_card() and voucher.ability.name == 'Illusion' then
            ret.playing_card.x_mult = (ret.playing_card.x_mult or 1) * voucher.ability.extra
        end
    end
end
'''
match_indent = true
overwrite = true

