if BalatroTCG.GameActive then
    suit_options = {}
    local amount = math.max((math.ceil(#visible_suit / 4) + 1), 2)

	for i = 1, amount do
		table.insert(suit_options,
			localize('k_page') .. ' ' .. tostring(i) .. '/' .. tostring(amount))
	end


    if args and args.cycle_config and args.cycle_config.current_option == amount then
        local items = {}
        for k, v in ipairs(G.playing_cards) do
            if not v:is_playing_card() then
                items[#items + 1] = v
            end
        end
        local rows = math.max(math.min(math.ceil(#items / 13), 1), 4)
        local parts = rows

        deck_tables = {}
        for j = 1, parts do
            local columns = math.ceil(#items / rows)

            local view_deck = CardArea(
                G.ROOM.T.x + 0.2*G.ROOM.T.w/2,G.ROOM.T.h,
                6.5*G.CARD_W,
                0.6*G.CARD_H,
                {card_limit = columns, type = 'title', view_deck = true, highlight_limit = 0, card_w = G.CARD_W*0.7, draw_layers = {'card'}})
                table.insert(deck_tables, 
                {n=G.UIT.R, config={align = "cm", padding = 0}, nodes={
                {n=G.UIT.O, config={object = view_deck}}
            }})

            for i = 1, columns do
                local greyed, _scale = nil, 0.7
                if unplayed_only and not (items[1].area and items[1].area == G.deck) then
                    if BalatroTCG.PlayerActive then
                        greyed = true
                    end
                end
                local copy = copy_card(items[1], nil, _scale)
                copy.greyed = greyed
                copy.T.x = view_deck.T.x + view_deck.T.w/2
                copy.T.y = view_deck.T.y

                copy:hard_set_T()
                view_deck:emplace(copy)

                table.remove(items, 1)
            end
            
            rows = rows - 1
        end

    end

    visible_suit = {'a', 'b', 'c', 'd', 'e'}

end

G.playing_cards = temp_playing

'''
